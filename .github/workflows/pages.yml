name: site

# The site (web-builder/) on GitHub Pages. It follows main: a release is what users build from.
# Enable once: repository Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-builder/package-lock.json
      - name: Build the site
        working-directory: web-builder
        run: npm ci && npm test && npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-builder/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
