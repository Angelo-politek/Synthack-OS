name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No Elektron firmware in the repository
        run: python tools/hooks/check_no_firmware.py --all
      - name: Install
        run: pip install pytest unicorn
      - name: Tests (those needing the stock OS are skipped)
        run: python -m pytest -q -rs
      - name: docs/registry.md up to date
        run: python tools/build/registry.py && git diff --exit-code docs/registry.md
