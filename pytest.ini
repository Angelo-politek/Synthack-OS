[pytest]
# Unicorn su Windows genera (e gestisce da solo) eccezioni di accesso quando
# mappa la memoria: faulthandler le stamperebbe come crash anche se i test passano.
addopts = -p no:faulthandler
# solo i test del progetto: una copia di synfact-dev accanto (strumento dei sample lunghi) ha i suoi
testpaths = tests
markers =
    slow: oltre 5 secondi (tests/slow_tests.txt); -m "not slow" gira in ~6 minuti con l'OS stock
